name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          V=1.21.4-54.0.12
          unzip -q residentevil-forge-1.21.4.zip
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/$V/forge-$V-mdk.zip
          mkdir mdk && unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r re/src mdk/src
          cd mdk
          sed -i '/causeFallDamage/d' src/main/java/com/residentevil/Wesker.java
          sed -i 's|p.sword(ToolMaterial.IRON, 3.0f, -1.6f)|p.durability(250).attributes(net.minecraft.world.item.component.ItemAttributeModifiers.builder().add(net.minecraft.world.entity.ai.attributes.Attributes.ATTACK_DAMAGE, new net.minecraft.world.entity.ai.attributes.AttributeModifier(Item.BASE_ATTACK_DAMAGE_ID, 5.0, net.minecraft.world.entity.ai.attributes.AttributeModifier.Operation.ADD_VALUE), net.minecraft.world.entity.EquipmentSlotGroup.MAINHAND).add(net.minecraft.world.entity.ai.attributes.Attributes.ATTACK_SPEED, new net.minecraft.world.entity.ai.attributes.AttributeModifier(Item.BASE_ATTACK_SPEED_ID, -1.6, net.minecraft.world.entity.ai.attributes.AttributeModifier.Operation.ADD_VALUE), net.minecraft.world.entity.EquipmentSlotGroup.MAINHAND).build())|' src/main/java/com/residentevil/ModItems.java
          sed -i 's/^mod_id=.*/mod_id=residentevil/; s/^mod_name=.*/mod_name=Resident Evil/; s/^mod_group_id=.*/mod_group_id=com.residentevil/' gradle.properties
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: mdk/build/libs/
