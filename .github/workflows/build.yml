name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Build
        run: |
          V=1.21.4-54.0.12
          unzip -q residentevil-forge-1.21.4.zip
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/$V/forge-$V-mdk.zip
          mkdir mdk && unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r re/src mdk/src
          cd mdk
          sed -i 's/^mod_id=.*/mod_id=residentevil/; s/^mod_name=.*/mod_name=Resident Evil/; s/^mod_group_id=.*/mod_group_id=com.residentevil/' gradle.properties
          chmod +x gradlew
          ./gradlew build
          ls -la build/libs
          cp "$(ls build/libs/*.jar | head -1)" ../residentevil-mod.jar
      - name: Save jar to repo
        run: |
          git config user.name build-bot
          git config user.email bot@example.com
          git add residentevil-mod.jar
          git commit -m "Built mod jar"
          git push
