name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          V=1.21.4-54.0.12
          unzip -q residentevil-forge-1.21.4.zip
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/$V/forge-$V-mdk.zip
          mkdir mdk && unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r re/src mdk/src
          cd mdk
          sed -i 's/^mod_id=.*/mod_id=residentevil/; s/^mod_name=.*/mod_name=Resident Evil/; s/^mod_group_id=.*/mod_group_id=com.residentevil/' gradle.properties
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: mdk/build/libs/*.jar
